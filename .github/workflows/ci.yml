name: CI

on:
  push:
    branches: [main]
    # Releases: v1.2.3 publishes the image as 1.2.3, 1.2, and latest
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  # The same checks as `mix precommit`, but failing instead of fixing.
  check:
    name: Compile, format, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix test

  # Integration tests against the real Docker Engine, with the fixture suite and
  # registry (the spec's "Testing" section).
  docker:
    name: Docker integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Build the fixture suite image
        run: docker build -t testfleet/fixture-suite:dev test/support/fixtures/suite

      - name: Start the fixture registry and push the fixture
        run: |
          docker compose --profile registry up -d registry
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5055/v2/ && break
            sleep 1
          done
          echo fixture-password | docker login localhost:5055 -u fixture --password-stdin
          docker tag testfleet/fixture-suite:dev localhost:5055/fixture-suite:dev
          docker push localhost:5055/fixture-suite:dev
          docker logout localhost:5055

      # Through the socket proxy, as in production: the tests then also catch calls
      # the proxy forbids, and the broken-stream tests need a tcp:// Docker host.
      - name: Start the Docker socket proxy
        run: |
          docker compose up -d docker-socket-proxy
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:2375/_ping && break
            sleep 1
          done
          curl -sf http://localhost:2375/_ping

      - run: mix deps.get

      - run: mix test --only docker
        env:
          DOCKER_HOST: tcp://localhost:2375

  # The production image, booted with the production Compose file on an empty
  # database. A smoke test: it builds,
  # starts, migrates, and answers /health. Its layers are cached for `publish`.
  # Each platform builds on a native runner: compiling under emulation is slow.
  image:
    name: Production image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: deploy

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: testfleet:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Generate .env
        run: |
          {
            echo "PHX_HOST=testfleet.ci"
            echo "SECRET_KEY_BASE=$(openssl rand -base64 48 | tr -d '\n')"
            echo "CLOAK_KEY=$(openssl rand -base64 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "TESTFLEET_IMAGE=testfleet:ci"
          } > .env

      - name: Start
        run: docker compose up -d --wait --wait-timeout 180

      - name: Check health
        run: curl -fsS http://127.0.0.1:4000/health

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  # Publishes the image to GHCR once everything above is green: main and
  # sha-<short> for every push to main; 1.2.3, 1.2, and latest
  # for a v1.2.3 tag. Pull requests never publish.
  #
  # One image for linux/amd64 and linux/arm64 (a Raspberry Pi, for example): each
  # platform is pushed by digest from its native runner, from the layers `image`
  # cached, then `manifest` puts both under the tags.
  publish:
    name: Publish image (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [check, docker, image]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against mix.exs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^\s*version: "([^"]+)".*/\1/p' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in mix.exs ($version)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For the labels only; the tags are put on in `manifest`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/testfleetlabs/testfleet

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/testfleetlabs/testfleet,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-platform image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/testfleetlabs/testfleet
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Put both platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/testfleetlabs/testfleet@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "ghcr.io/testfleetlabs/testfleet:${{ steps.meta.outputs.version }}"
