name: E2E suite

# The Playwright suite against testfleet.io (e2e/testfleet.io), as an image on
# GHCR: main and sha-<short> for every push to main. Pull requests only check and
# build it. The package stays private; TestFleet pulls it with a registry entry
# for ghcr.io and a token with read:packages.
on:
  push:
    branches: [main]
    paths: ["e2e/testfleet.io/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["e2e/testfleet.io/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/testfleet.io

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/testfleet.io/.nvmrc
          cache: npm
          cache-dependency-path: e2e/testfleet.io/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run fmt:check

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The image only installs npm packages, so arm64 under emulation is fast enough
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/testfleetlabs/testfleet-e2e
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: e2e/testfleet.io
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
